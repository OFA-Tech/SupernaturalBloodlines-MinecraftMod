name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # secrets cannot be tested in a step-level `if`, so map them to env first
      CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
      CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build --console=plain

      - name: Version type from the tag (v1.2.3-alpha -> alpha, -beta -> beta, otherwise release)
        id: kind
        run: |
          case "$GITHUB_REF_NAME" in
            *alpha*) echo "type=alpha" >> "$GITHUB_OUTPUT" ;;
            *beta*) echo "type=beta" >> "$GITHUB_OUTPUT" ;;
            *) echo "type=release" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Attach the jar to a GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/supernaturalbloodlines-*.jar
          prerelease: ${{ steps.kind.outputs.type != 'release' }}
          generate_release_notes: true

      # Runs only when the repository has the CURSEFORGE_TOKEN secret and the CURSEFORGE_PROJECT_ID variable.
      # `version` and `name` are set because mc-publish only defaults them from a release event, not a tag push.
      - name: Upload to CurseForge
        if: ${{ env.CURSEFORGE_TOKEN != '' && env.CURSEFORGE_PROJECT_ID != '' }}
        uses: Kira-NT/mc-publish@v3
        with:
          curseforge-id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: build/libs/supernaturalbloodlines-*.jar
          name: Supernatural Bloodlines ${{ github.ref_name }}
          version: ${{ github.ref_name }}
          version-type: ${{ steps.kind.outputs.type }}
          loaders: neoforge
          game-versions: 1.21.1
          java: 21
