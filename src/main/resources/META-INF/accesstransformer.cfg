# The Hunter's sense outlines entities on one client only (client/HunterSenseClient). The glow flag is shared entity
# data, and these two protected calls are the only way to read and change it on the client. A mixin would cost one of
# the species part's 3 (docs/mixins.md).
public net.minecraft.world.entity.Entity setSharedFlag(IZ)V
public net.minecraft.world.entity.Entity getSharedFlag(I)Z

# Electricity skips a visual-only bolt (a decorative one does not shock anyone), and the bolt has no getter for it.
public net.minecraft.world.entity.LightningBolt visualOnly

# Hiding covered keys from the Controls screen (parts/hud/client/KeyHiding): the screen's list, and the mapping of a vanilla key entry. Reads only.
public net.minecraft.client.gui.screens.options.controls.KeyBindsScreen keyBindsList
public net.minecraft.client.gui.screens.options.controls.KeyBindsList$KeyEntry key

# The mode pill gives way while an action bar message is up (parts/hud/client/LiveHud): both stand on the same pixels. Reads only.
public net.minecraft.client.gui.Gui overlayMessageTime

# Our boss bars (parts/bosses/client/BossBarClient): vanilla's overlay keeps its bars in a package-private map, and our cards are drawn in one pass from it. Reads only.
public net.minecraft.client.gui.components.BossHealthOverlay events
