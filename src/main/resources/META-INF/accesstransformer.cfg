# The Hunter's sense outlines entities on one client only (client/HunterSenseClient). The glow flag is shared entity
# data, and these two protected calls are the only way to read and change it on the client. A mixin would cost one of
# the species part's 3 (docs/mixins.md).
public net.minecraft.world.entity.Entity setSharedFlag(IZ)V
public net.minecraft.world.entity.Entity getSharedFlag(I)Z

# Electricity skips a visual-only bolt (a decorative one does not shock anyone), and the bolt has no getter for it.
public net.minecraft.world.entity.LightningBolt visualOnly
